<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livros</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Cadastro de Livros</h1>

    <form id="formLivro">

        <label>Nome do livro:</label>
        <input type="text" id="nome" required>
        <br><br>

        <label>Autor:</label>
        <input type="text" id="autor" required>
        <br><br>

        <label>Categoria:</label>
        <select id="categoria" required>
            <option value="">Selecione uma categoria</option>
            <option value="Romance">Romance</option>
            <option value="Fantasia">Fantasia</option>
            <option value="Terror">Terror</option>
            <option value="Aventura">Aventura</option>
            <option value="Ficção Científica">Ficção Científica</option>
            <option value="Mistério">Mistério</option>
            <option value="Romance e Fantasia">Romance e Fantasia</option>
            <option value="Romance e Terror">Romance e Terror</option>
            <option value="Fantasia e Aventura">Fantasia e Aventura</option>
            <option value="Outros">Outros</option>
        </select>

        <br><br>

        <label>Quantidade:</label>
        <input type="number" id="quantidade" required>
        <br><br>

        <label>Status:</label>
        <select id="status">
            <option value="Disponível">Disponível</option>
            <option value="Emprestado">Emprestado</option>
        </select>

        <br><br>

        <button type="submit">Cadastrar livro</button>

    </form>

    <br>

    <a href="livros.html">Ver livros cadastrados</a>

    <script src="script.js"></script>

</body>

</html>
