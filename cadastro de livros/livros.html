<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Livros Cadastrados</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4eee4;
            margin: 40px;
            color: #3e2f23;
        }

        h1 {
            color: #5c4033;
        }

        #listaLivros {
            background-color: #fffaf2;
            padding: 20px;
            width: 600px;
            border: 1px solid #c8b59d;
        }

        #listaLivros h2 {
            color: #6b4f3a;
        }

        #listaLivros p {
            margin: 8px 0;
        }

        button {
            background-color: #6b4f3a;
            color: white;
            padding: 8px 15px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #4e3829;
        }

        a {
            color: #6b4f3a;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <h1>Livros Cadastrados</h1>

    <div id="listaLivros"></div>

    <br>

    <a href="index.html">Cadastrar novo livro</a>

    <script src="script.js"></script>

</body>

</html>
